version: 2

project_name: jitter-token

before:
  hooks:
    - go mod tidy

# Build configuration
builds:
  - id: jitter-token
    main: ./cmd/jitter-token/main.go
    binary: jitter-token
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - '7'
    flags:
      - -trimpath
    ldflags:
      - -s -w -buildid=

# Archive configuration
archives:
  - id: archive
    formats: [ 'tar.gz' ]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [ 'zip' ]

# Checksum configuration
checksum:
  name_template: 'checksums.txt'

# Changelog configuration
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

# Homebrew tap configuration
brews:
  - name: jitter-token
    repository:
      owner: nimish-nirmal
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/nimish-nirmal/jitter-distill"
    description: "Hardware timing jitter entropy distillation token generator"
    license: "MIT"
    install: |
      bin.install "jitter-token"